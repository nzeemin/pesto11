name: push-matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
        - name: "Ubuntu latest GCC"
          os: ubuntu-latest
          cxx: "g++"
        - name: "Ubuntu latest Clang"
          os: ubuntu-latest
          cxx: "clang++"
        - name: "macOS latest Clang"
          os: macos-latest
          cxx: "clang++"
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Build and test
      env:
        CXX: ${{ matrix.config.cxx }}
      run: |
        make
        testrunner/testrunner

  build-windows:
    name: "Windows latest MSVC"
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: microsoft/setup-msbuild@v2

    - name: Build
      run: msbuild pesto11-VS2022.sln /p:Configuration=Release /p:Platform=x86

    - name: Test
      shell: cmd
      run: |
        set CONFIGURATION=Release
        call !tests-run.cmd
